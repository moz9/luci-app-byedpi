name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - run: node --test tests/*.test.cjs
      - run: shellcheck -s sh -S error install.sh uninstall.sh root/usr/libexec/byedpi-luci root/usr/libexec/byedpi-luci-test
      - run: for file in install.sh uninstall.sh root/usr/libexec/byedpi-luci root/usr/libexec/byedpi-luci-test; do busybox sh -n "$file"; done
      - run: |
          mkdir -p /tmp/byedpi-busybox
          ln -s "$(command -v busybox)" /tmp/byedpi-busybox/sh
          TEST_SHELL=/tmp/byedpi-busybox/sh node --test tests/*.test.cjs
